<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; connect-src 'none'; media-src 'none'; frame-src 'none'; object-src 'none'; style-src 'unsafe-inline'; img-src 'self'; font-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coming Soon · Red-flag Research</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<style>
:root{color-scheme:dark;--bg:#0b0d10;--text:#e8eaed;--text-2:#b3b9c2;--muted:#8a919c;--red:#b3261e;--cyan:#57c7cf}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:400 16px/1.6 system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-underline-offset:4px}
a:hover{color:var(--cyan)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:5px}
.wrap{width:100%;max-width:1224px;margin:0 auto;padding-left:32px;padding-right:32px}
header{padding-top:24px;padding-bottom:24px}
.brand{display:inline-flex;align-items:center;gap:10px;color:var(--text);font:500 20px/1.2 Georgia,serif;text-decoration:none}
.tile{flex:none;width:36px;height:36px;border-radius:8px;background:var(--red);display:grid;place-items:center}
.by{margin:12px 0 0;color:var(--muted);font-size:14px}
main{flex:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding-top:64px;padding-bottom:64px}
h1{margin:0 0 20px;font:500 clamp(48px,8vw,112px)/.98 Georgia,serif;letter-spacing:-.035em}
.lead{margin:0 0 32px;color:var(--text-2);font-size:18px}
nav{display:flex;flex-wrap:wrap;gap:24px}
@media(max-width:720px){.wrap{padding-left:16px;padding-right:16px}.brand{font-size:18px}main{padding-top:40px;padding-bottom:40px}}
</style>
</head>
<body>
<header class="wrap">
  <a class="brand" href="/" aria-label="Red-flag Research home">
    <span class="tile">
      <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M10 5v23" stroke="#fff4f2" stroke-width="2.6" stroke-linecap="round" fill="none"/>
        <path fill="#fff4f2" d="M11 6.5c3.5-1.8 6.5 1.6 10 0s4.5-.8 4.5-.8v10.3s-1.4 1-4.5.8-6.5-2.4-10 0z"/>
      </svg>
    </span>
    <span>Red-flag Research</span>
  </a>
  <p class="by">by OpenLAIR / Ziqian Zhang</p>
</header>
<main class="wrap">
  <h1>Coming Soon</h1>
  <p class="lead">The live view is currently unavailable.</p>
  <nav aria-label="Site">
    <a href="/">Project home</a>
    <a href="/results/">Results</a>
  </nav>
</main>
</body>
</html>
